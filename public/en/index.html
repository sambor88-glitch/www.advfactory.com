<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADV Factory - Trips and transport from CRM</title>
    <meta
      name="description"
      content="New ADV Factory website with CRM integration: lead collection and live trips/transport data."
    />
    <link rel="canonical" href="https://www.advfactory.com/en" />
    <link rel="alternate" hreflang="pl" href="https://www.advfactory.com/pl" />
    <link rel="alternate" hreflang="en" href="https://www.advfactory.com/en" />
    <link rel="alternate" hreflang="x-default" href="https://www.advfactory.com/pl" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav class="lang-switch" aria-label="Language switcher">
        <a href="/pl" lang="pl">PL</a>
        <strong>EN</strong>
      </nav>
      <h1>New ADV Factory website</h1>
      <p>Lead collection and trips/transport offers displayed from CRM.</p>
    </header>

    <main
      id="app"
      data-language="en"
      data-empty-trips="No trips available."
      data-empty-transports="No transports available."
      data-load-error="Could not load CRM data."
      data-sending-label="Sending..."
      data-success-label="Thanks for contacting us."
      data-error-label="Could not send the form."
    >
      <section>
        <h2>Trips</h2>
        <div id="trips-list" class="card-list"></div>
      </section>

      <section>
        <h2>Transport</h2>
        <div id="transports-list" class="card-list"></div>
      </section>

      <section>
        <h2>Lead form</h2>
        <form id="lead-form">
          <label>Full name <input name="name" type="text" autocomplete="name" required /></label>
          <label>E-mail <input name="email" type="email" autocomplete="email" required /></label>
          <label>Phone <input name="phone" type="tel" autocomplete="tel" /></label>
          <label>Message <textarea name="message" rows="4" autocomplete="off"></textarea></label>
          <button type="submit">Send</button>
          <p id="lead-status" class="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer>
      <small>&copy; ADV Factory</small>
    </footer>

    <script src="/app.js" defer></script>
  </body>
</html>
